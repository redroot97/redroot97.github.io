<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" font-family="JetBrains Mono, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff3344" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="#0a0a0a"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>

  <!-- Crosshair / radar accent (mid) -->
  <g transform="translate(1180, 200)" opacity="0.5">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#ff3344" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3 6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ff3344" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 5"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ff3344" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#ff3344" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#ff3344" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- Top-left: terminal prompt -->
  <g transform="translate(60, 56)">
    <text x="0" y="0" font-size="20" fill="#666" font-weight="500">~/</text>
    <text x="28" y="0" font-size="20" fill="#ececec" font-weight="700">redroot97</text>
    <rect x="158" y="-18" width="13" height="24" fill="#ff3344"/>
  </g>

  <!-- Main handle / name -->
  <g transform="translate(420, 150)">
    <text x="0" y="0" font-size="42" fill="#ff3344" font-weight="900">@</text>
    <text x="34" y="0" font-size="42" fill="#ececec" font-weight="900">redroot97</text>
  </g>

  <!-- Main title - two lines, accent on key word -->
  <g transform="translate(420, 220)">
    <text x="0" y="0" font-size="38" font-weight="900" letter-spacing="-1">
      <tspan fill="#ececec">Senior </tspan><tspan fill="#ff3344">Offensive Security</tspan><tspan fill="#ececec"> Engineer</tspan>
    </text>
  </g>

  <!-- Accent line -->
  <rect x="420" y="244" width="80" height="3" fill="#ff3344"/>

  <!-- Subtitle / achievements -->
  <g transform="translate(420, 296)">
    <text x="0" y="0" font-size="18" fill="#888" letter-spacing="0.02em">
      <tspan fill="#ececec" font-weight="700">9 CVEs</tspan>
      <tspan fill="#444"> // </tspan>
      <tspan fill="#ececec" font-weight="700">EBCDitor</tspan>
      <tspan fill="#444"> // </tspan>
      <tspan fill="#ececec" font-weight="700">Ghost Span C2</tspan>
      <tspan fill="#444"> // </tspan>
      <tspan fill="#ececec" font-weight="700">Sticky Grabber BOF</tspan>
    </text>
    <text x="0" y="28" font-size="14" fill="#666">red team // purple team // adversary simulation // CVE research</text>
  </g>

  <!-- Right side: terminal card -->
  <g transform="translate(1320, 70)">
    <!-- Card frame -->
    <rect x="0" y="0" width="220" height="256" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="6"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="220" height="26" fill="#1a1a1a" rx="6"/>
    <rect x="0" y="20" width="220" height="6" fill="#1a1a1a"/>
    <circle cx="14" cy="13" r="4.5" fill="#ff5566"/>
    <circle cx="32" cy="13" r="4.5" fill="#ffaa00"/>
    <circle cx="50" cy="13" r="4.5" fill="#4ade80"/>
    <text x="110" y="17" font-size="10" fill="#555" text-anchor="middle">redroot97@kali</text>

    <!-- Terminal content -->
    <g font-size="11.5" font-family="JetBrains Mono, Menlo, monospace">
      <text x="14" y="56" fill="#666">$</text>
      <text x="28" y="56" fill="#ececec">whoami</text>
      <text x="14" y="76" fill="#ff3344" font-weight="700">redroot97</text>

      <text x="14" y="106" fill="#666">$</text>
      <text x="28" y="106" fill="#ececec">cat ./cves</text>
      <text x="14" y="126" fill="#4ade80">2 Apple // 7 pending</text>

      <text x="14" y="156" fill="#666">$</text>
      <text x="28" y="156" fill="#ececec">ls ./tools/</text>
      <text x="14" y="174" fill="#ececec">ebcditor</text>
      <text x="14" y="190" fill="#ececec">ghost-span-c2</text>
      <text x="14" y="206" fill="#ececec">sticky-grabber-bof</text>

      <text x="14" y="234" fill="#666">$</text>
      <rect x="28" y="225" width="9" height="13" fill="#ff3344"/>
    </g>
  </g>

  <!-- Bottom-right: URL footer -->
  <g transform="translate(1524, 372)">
    <text x="0" y="0" text-anchor="end" font-size="12" fill="#555">redroot97.github.io  //  github.com/redroot97</text>
  </g>

  <!-- Subtle scanline accent (1px every 4px) -->
  <g opacity="0.04">
    <rect x="0" y="0" width="1584" height="1" fill="#ececec"/>
    <rect x="0" y="4" width="1584" height="1" fill="#ececec"/>
    <rect x="0" y="8" width="1584" height="1" fill="#ececec"/>
  </g>
</svg>
